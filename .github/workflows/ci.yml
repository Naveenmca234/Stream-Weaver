name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017

    env:
      MONGODB_URI: mongodb://127.0.0.1:27017
      MONGODB_DATABASE: streamweaver_ci
      MONGODB_COLLECTION: ingested_rows
      MONGODB_BATCH_SIZE: 5000

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Run sandbox verification
        working-directory: server
        run: npm run test:sandbox

      - name: Start StreamWeaver backend
        working-directory: server
        env:
          PORT: 5001
          CLIENT_ORIGIN: http://localhost:5173
        run: |
          npm start > /tmp/streamweaver-server.log 2>&1 &
          echo $! > /tmp/streamweaver-server.pid

          for i in {1..30}; do
            if curl -fsS http://localhost:5001/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat /tmp/streamweaver-server.log
          exit 1

      - name: Run Week 3 realtime verification
        working-directory: client
        env:
          WEEK3_BACKEND_ORIGIN: http://localhost:5001
        run: npm run test:week3

      - name: Run Week 4 bulk ingestion verification
        working-directory: server
        env:
          WEEK4_BACKEND_ORIGIN: http://localhost:5001
        run: npm run test:week4

      - name: Build frontend
        working-directory: client
        run: npm run build

  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Audit backend dependencies
        working-directory: server
        run: npm audit --audit-level=high || true

      - name: Audit frontend dependencies
        working-directory: client
        run: npm audit --audit-level=high || true
