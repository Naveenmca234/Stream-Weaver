version: '3.9'

# StreamWeaver - High-Throughput No-Code ETL Pipeline
# This docker-compose file sets up the complete development environment
# with MongoDB, Redis, Backend API, Frontend, and supporting services

services:
  # =====================================================
  # DATABASE LAYER
  # =====================================================
  
  # MongoDB: Main data store for pipelines, datasets, runs
  # - Uses Alpine Linux for minimal image size
  # - Authentication enabled with configurable credentials
  # - Persistent volume for data retention
  # - Health checks ensure container is ready before dependents start
  mongodb:
    image: mongo:7-alpine
    container_name: streamweaver-mongodb
    restart: unless-stopped
    environment:
      # Database credentials - override in .env file for production
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-password}
      MONGO_INITDB_DATABASE: streamweaver
      # Performance tuning
      MONGOD_OPTS: "--wiredTigerCacheSizeGB=2 --serverSelectionTimeoutMS=10000"
    volumes:
      # Persistent storage for MongoDB data
      - mongodb_data:/data/db
      # Optional: Backup directory
      - ./backups/mongodb:/backup
    ports:
      # MongoDB native port (only expose for dev, restrict in production)
      - "27017:27017"
    # Resource limits (adjust based on your system)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - streamweaver
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =====================================================
  # CACHE & MESSAGE QUEUE LAYER
  # =====================================================
  
  # Redis: Cache and BullMQ job queue
  # - Alpine Linux for minimal footprint
  # - Persistence enabled (AOF - Append Only File)
  # - Password protection for security
  # - Used for caching and pipeline job queue
  redis:
    image: redis:7-alpine
    container_name: streamweaver-redis
    restart: unless-stopped
    # AOF persistence + password protection
    command: >
      redis-server 
      --appendonly yes 
      --requirepass ${REDIS_PASSWORD:-redis123}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      # Persistent storage for Redis data
      - redis_data:/data
    ports:
      # Redis native port (restrict in production)
      - "6379:6379"
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - streamweaver
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =====================================================
  # APPLICATION LAYER
  # =====================================================
  
  # Express Backend API Server
  # - Builds from Dockerfile using backend-runtime stage
  # - Handles ETL pipeline processing, user management, and WebSocket communication
  # - Depends on MongoDB and Redis being healthy
  # - Exposes REST API (port 4000) and WebSocket server (port 4001)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-runtime
      # Build args if needed
      # args:
      #   NODE_ENV: development
    container_name: streamweaver-backend
    restart: unless-stopped
    # Wait for dependencies to be healthy
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Environment configuration
    environment:
      # Execution environment
      NODE_ENV: ${NODE_ENV:-development}
      
      # Server ports
      PORT: 4000                          # REST API port
      WS_PORT: 4001                       # WebSocket server port
      
      # Database connections
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-password}@mongodb:27017/streamweaver?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379
      
      # Frontend configuration
      CLIENT_URL: http://localhost:5173
      
      # Security - CHANGE THESE IN PRODUCTION!
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-key}
      
      # File upload configuration
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE: 10737418240         # 10GB
      
      # ETL Processing
      BATCH_SIZE: 5000                    # Records per batch
      
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}
    
    # Port mappings
    ports:
      - "4000:4000"  # REST API
      - "4001:4001"  # WebSocket server
    
    # Volumes for uploads and logs
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
      - ./backend_backup/src:/app/src:ro  # Optional: hot-reload source
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    
    networks:
      - streamweaver
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # =====================================================
  # PRESENTATION LAYER
  # =====================================================
  
  # React Frontend with Nginx reverse proxy
  # - Serves static React app via Nginx
  # - Proxies API requests to backend
  # - Handles WebSocket connections
  # - SPA routing configured for React Router
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-runtime
    container_name: streamweaver-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    
    # Frontend environment variables
    environment:
      # API configuration
      VITE_API_BASE_URL: http://backend:4000/api
      VITE_WS_URL: ws://backend:4001
      VITE_ENV: ${VITE_ENV:-development}
    
    # Port mapping
    ports:
      - "5173:80"  # Nginx web server
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    
    networks:
      - streamweaver
    
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # =====================================================
  # ADMINISTRATION & MONITORING
  # =====================================================
  
  # Adminer: Database administration UI
  # - Web-based MongoDB client
  # - Optional service for development/debugging
  # - Disable in production (remove this service or set profiles)
  adminer:
    image: adminer:4.8.1-standalone
    container_name: streamweaver-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: mongodb
    ports:
      - "8080:8080"  # Adminer UI port
    depends_on:
      - mongodb
    # Only run in development
    profiles:
      - dev
    networks:
      - streamweaver
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  # MongoDB persistent data storage
  mongodb_data:
    driver: local
  
  # Redis persistent data storage (AOF format)
  redis_data:
    driver: local
  
  # Backend uploaded files storage
  backend_uploads:
    driver: local
  
  # Backend application logs
  backend_logs:
    driver: local

networks:
  # Bridge network for all services communication
  streamweaver:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
